name: emotional_bakery
description: "A new Flutter project."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1 # 상태 관리용
  audioplayers: ^5.2.1 # BGM, 효과음용
  json_annotation: ^4.8.1 # JSON 파싱용
  shared_preferences: ^2.3.2 # 저장/불러오기용 로컬 키-값 저장소
  web: ^1.1.0 # iOS 사파리인지 판별할 때 씀(navigator 읽는 웹 전용 API)

  cupertino_icons: ^1.0.8
  flame: ^1.37.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  build_runner: ^2.4.9
  json_serializable: ^6.8.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/sounds/
    - assets/data/
    - assets/data/chapter1/
    - assets/data/chapter3/
    - assets/data/shared/
    - assets/lines/
    - assets/lines/chapter1/
    - assets/lines/chapter2/
    - assets/lines/chapter3/
    - assets/lines/chapter4/
    - assets/lines/chapter5/

  fonts:
    - family: SCDream
      fonts:
        - asset: assets/fonts/SCDream1.otf
          weight: 100
        - asset: assets/fonts/SCDream2.otf
          weight: 200
        - asset: assets/fonts/SCDream3.otf
          weight: 300
        - asset: assets/fonts/SCDream4.otf
          weight: 400
        - asset: assets/fonts/SCDream5.otf
          weight: 500
        - asset: assets/fonts/SCDream6.otf
          weight: 600
        - asset: assets/fonts/SCDream7.otf
          weight: 700
        - asset: assets/fonts/SCDream8.otf
          weight: 800
        - asset: assets/fonts/SCDream9.otf
          weight: 900

# 앱 아이콘(웹 + 안드로이드) 생성 설정. 원본은 assets/icon/app_icon.png(1158x1158, 여백
# 없이 꽉 찬 빵집 그림) - 안드로이드 adaptive icon은 런처마다 원형/둥근사각형 등으로 마스킹
# 되는데, 그 안전 영역(중앙 약 66%)을 벗어나면 지붕/화분/간판 같은 중요한 부분이 잘림.
# 그래서 foreground 전용으로 원본을 66%로 축소해서 투명 여백을 두른
# app_icon_foreground.png를 따로 만들어 씀(assets/icon/app_icon.png 자체는 안 건드림).
# 배경색(#262626)은 원본 이미지 모서리 배경색을 실측해서 그대로 맞춘 값
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#262626"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#262626"
    theme_color: "#262626"
